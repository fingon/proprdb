name: Go implementation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/system/go.sum
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: make go-fixtures go-lint go-test go-build race verify-generated
      - run: CGO_ENABLED=0 make go-test go-build
      - run: git diff --exit-code -- test/testdata test/system/system.proprdb.pb.go
