name: Swift runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsqlite3-dev
      - run: make go-fixtures swift-test swift-build SWIFT_ARGS=--disable-sandbox
      - run: go test ./test -run 'TestProtocSwiftPlugin|TestProtocPluginsValidateDirtyWindows|TestSwiftToolWrapper'
