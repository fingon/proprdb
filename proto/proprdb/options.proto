syntax = "proto3";

package com.github.fingon.proprdb;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/fingon/proprdb/proto/proprdb;proprdbpb";

extend google.protobuf.FieldOptions {
  bool external = 50001;
}

message Index {
  repeated string fields = 1;
}

message DirtyKeys {
  string name = 1;
  repeated string watched_fields = 2;
  repeated string watched_hashes = 3;
}

message HashProjection {
  string name = 1;
  repeated string fields = 2;
}

message DirtyWindow {
  string name = 1;
  string start_field = 2;
  string end_field = 3;
}

extend google.protobuf.MessageOptions {
  bool omit_table = 50002;
  bool omit_sync = 50003;
  bool validate_write = 50004;
  bool allow_custom_id_insert = 50005;
  repeated Index indexes = 50006;
  bool change_listeners = 50007;
  bool query_statistics = 50008;
  repeated string external_paths = 50009;
  repeated DirtyWindow dirty_windows = 50010;
  repeated DirtyKeys dirty_keys = 50011;
  repeated HashProjection hash_projections = 50012;
}
